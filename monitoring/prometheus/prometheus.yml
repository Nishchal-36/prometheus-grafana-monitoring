global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: monlab

rule_files:
  - /etc/prometheus/alert.rules.yml
  - /etc/prometheus/recording.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # The two Windows web VMs are registered through file-based service discovery.
  # The files are generated by Terraform/cloud-init with the current private IPs,
  # so adding a third web VM later only means touching the target files.
  - job_name: windows
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/windows.json
        refresh_interval: 1m

  - job_name: nginx
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/nginx.json
        refresh_interval: 1m

  - job_name: node-app
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/app.json
        refresh_interval: 1m
